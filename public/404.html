<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>页面未找到 · 轻工具箱 LiteBox</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 40px 20px;
    }
    .e404 {
      max-width: 420px;
    }
    .e404 .num {
      font-size: 96px;
      font-weight: 900;
      line-height: 1;
      background: var(--brand-grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -4px;
    }
    .e404 h1 {
      font-size: 22px;
      font-weight: 800;
      margin: 16px 0 10px;
    }
    .e404 p {
      color: var(--fg2);
      font-size: 14px;
      line-height: 1.7;
      margin: 0 0 26px;
    }
    .e404 a {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 12px;
      background: var(--brand-grad);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      box-shadow: 0 8px 22px rgba(74,90,230,.35);
      transition: transform .2s cubic-bezier(.34,1.3,.36,1);
    }
    .e404 a:active {
      transform: scale(.96);
    }
  </style>
</head>
<body>
  <div class="e404">
    <div class="num">404</div>
    <h1>页面走丢了</h1>
    <p>你访问的页面不存在或已被移除。<br>回到首页，89 个工具都在等你。</p>
    <a href="/">🏠 回到首页</a>
  </div>
</body>
</html>
